# The stock sensor runs a full `dotnet build` and greps for warnings. In a repo that sets
# TreatWarningsAsErrors and turns no metric rules on, it finds nothing. This one builds only the
# main project for net10.0 (edit the path and framework on the `warnings=` line), in Debug so it
# doesn't touch the Release output quick_check uses, turns on all analyzers, and keeps only the
# structural rules it maps to smells. `sort -u` because the build prints each warning twice.
command = """
files=$(printf '%s\\n' ${files})
if [ -z "$files" ]; then echo '[]'; exit 0; fi
set -o pipefail
warnings=$(dotnet build src/MyProject/MyProject.csproj -f net10.0 -c Debug --no-incremental -v quiet -p:TreatWarningsAsErrors=false -p:AnalysisMode=All -p:EnforceCodeStyleInBuild=true 2>&1 | grep -E ': warning (CA1502|CA1505|CA1506|CA1801|CA1811|CA1822|CA1823|CS0219|CS0168|IDE0051|IDE0052|IDE0060|IDE0005):' | grep -F -f <(printf '%s\\n' "$files") | sort -u || true)
if [ -z "$warnings" ]; then echo '[]'; exit 0; fi
echo "$warnings" | jq -R -s '
  split("\\n") | map(select(length > 0))
  | map(capture("^(?<file>[^(]+)\\\\((?<line>[0-9]+),(?<column>[0-9]+)\\\\): warning (?<rule>[A-Za-z]+[0-9]+): (?<message>.*)$")?)
  | map(select(. != null))
  | map(. + {
      smell: ({
        "CA1502": "high-complexity",
        "CA1505": "high-complexity",
        "CA1506": "high-coupling",
        "CA1801": "unused-parameter",
        "CA1811": "unused-private-member",
        "CA1822": "unused-member",
        "CA1823": "unused-field",
        "CS0219": "unused-variable",
        "CS0168": "unused-variable",
        "IDE0051": "unused-private-member",
        "IDE0052": "unused-private-member",
        "IDE0060": "unused-parameter",
        "IDE0005": "unused-import"
      }[.rule] // .rule)
    })
  | group_by(.smell)
  | map({
      smell: .[0].smell,
      details: {},
      issues: map({
        key: .file,
        details: {
          file: .file,
          line: (.line | tonumber),
          column: (.column | tonumber),
          message: .message,
          source: ("roslyn:" + .rule)
        }
      })
    })
'
"""
